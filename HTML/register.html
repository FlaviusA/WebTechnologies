<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../CSS/register_style.css">
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

    <main class="page">
      <section class="card">
        <h1 title="helloworld" class="centered">Register Page</h1>
        <form class="register-form" action="#" method="post" enctype="multipart/form-data">
            <div class="row">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="ex: FlaviusVcr" required>
            </div>
            <div class="row">
            <label for="email"> Email</label>
            <input type="email" id="email" name="email"placeholder="flaviusmoldova3@gmail.com" required>

        
            </div>
            <div class="row-two-col">
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div>
                    <label for="confirm_password">Confirm password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </div>
            </div>

            <div class="row">
                <label for="dob">Date of birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div class="row">
                <span class="group-label">Gender</span>
                <div class="options">
                    <label><input type="radio" name="gender" value="male" required> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                    <label><input type="radio" name="gender" value="other"> Other</label>
                </div>
            </div>

            <div class="row">
                <label for="country">Country</label>
                <select id="country" name="country" required>
                    <option value="" selected disabled>Select your country</option>
                    <option value="ro">Romania</option>
                    <option value="md">Moldova</option>
                    <option value="de">Germany</option>
                    <option value="fr">France</option>
                    <option value="it">Italy</option>
                    <option value="us">United States</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="row">
                <span class="group-label">Interests</span>
                <div class="options">
                    <label><input type="checkbox" name="interests" value="music"> Music</label>
                    <label><input type="checkbox" name="interests" value="sports"> Sports</label>
                    <label><input type="checkbox" name="interests" value="gaming"> Gaming</label>
                    <label><input type="checkbox" name="interests" value="coding"> Coding</label>
                    <label><input type="checkbox" name="interests" value="travel"> Travel</label>
                </div>
            </div>

            <div class="row">
                <label for="profile_picture">Profile picture</label>
                <input type="file" id="profile_picture" name="profile_picture" accept="image/*">
            </div>

            <button type="submit">Register</button>







      </form>

      </section>      





      

    </main>
    
</body>
</html>
